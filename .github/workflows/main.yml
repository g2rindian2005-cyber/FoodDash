name: CI/CD - Deploy FoodDash to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_DIR: /var/www/fooddash

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps
        working-directory: backend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Backend syntax check
        working-directory: backend
        run: |
          for f in $(find src -name '*.js'); do node --check "$f"; done

      - name: Install & build frontend
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload files to EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          SSH="ssh -i ~/.ssh/id_rsa"
          rsync -az --delete -e "$SSH" \
            --exclude node_modules --exclude .env \
            backend/ "$EC2_USER@$EC2_HOST:$APP_DIR/backend/"
          rsync -az --delete -e "$SSH" \
            frontend/dist/ "$EC2_USER@$EC2_HOST:$APP_DIR/frontend/dist/"

      - name: Install deps & restart API
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /var/www/fooddash/backend
          [ -f .env ] || { echo "ERROR: backend/.env missing on server" >&2; exit 1; }

          if [ -f package-lock.json ]; then npm ci --omit=dev; else npm install --omit=dev; fi

          if pm2 describe fooddash-api >/dev/null 2>&1; then
            pm2 restart fooddash-api --update-env
          else
            pm2 start src/server.js --name fooddash-api
          fi
          pm2 save

          for i in $(seq 1 15); do
            if curl -fsS http://localhost:5000/api/health >/dev/null; then
              echo "API healthy"
              sudo systemctl reload nginx
              exit 0
            fi
            sleep 2
          done
          echo "API failed health check" >&2
          pm2 logs fooddash-api --lines 40 --nostream >&2 || true
          exit 1
          REMOTE

      - name: Public health check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "http://$EC2_HOST/api/health"; then echo; echo "Deployed OK"; exit 0; fi
            echo "Waiting for app ($i/10)..."; sleep 5
          done
          echo "Health check failed"; exit 1
